<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAMAD-AGENT</title>
<style>body{background:#0a0a0a;color:#fff;font-family:Arial;margin:0;padding:15px}
.header{background:#111;border:1px solid #facc15;border-radius:15px;padding:15px;text-align:center}
.logo{font-size:28px;color:#facc15;font-weight:bold}
.card{background:#151515;border:1px solid #333;border-radius:12px;padding:15px;margin:15px 0}
.btn{background:#facc15;color:#000;border:none;padding:12px;border-radius:8px;font-weight:bold;width:100%;margin:8px 0}
textarea,input{width:100%;background:#000;color:#fff;border:1px solid #444;border-radius:8px;padding:12px;margin:8px 0;box-sizing:border-box}
.box{background:#000;height:180px;overflow-y:auto;padding:10px;border-radius:8px;border:1px solid #333;font-size:13px}
</style></head><body>
<div class="header"><div class="logo">⚡ SAMAD-AGENT</div><p>AI Business Agent - Earning Machine</p><h2 style="color:#facc15">$0 Earning Today</h2></div>
<div class="card"><h3>🤖 Order Likho</h3><textarea id="o" rows="3" placeholder="Likho: restaurant website bana de..."></textarea>
<button class="btn" onclick="r()">RUN AGENT 🚀</button><div class="box" id="c">> SAMAD-AGENT Online...<br>> Order likho Samad...</div></div>
<div class="card" id="res" style="display:none"><h3>🎉 Website Ready!</h3><div id="p"></div></div>
<script>function r(){let order=document.getElementById('o').value;let chat=document.getElementById('c');
if(!order){alert('Pehle order likho!');return;}chat.innerHTML+='<br>> You: '+order+'<br>> Agent: Kaam kar raha hun...';
setTimeout(()=>{chat.innerHTML+='<br>> Agent: Website ready ✅';document.getElementById('res').style.display='block';
document.getElementById('p').innerHTML='<div style=background:#fff;color:#000;padding:20px;border-radius:10px><h1>'+order+'</h1><p>Professional website by SAMAD-AGENT</p><button style=background:#facc15;padding:10px;border:none;border-radius:5px>Contact Us</button></div>';},1200);}</script>
</body></html>
