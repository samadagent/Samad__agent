<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SAMAD-AGENT VOICE PRO</title><style>body{background:#0a0a0a;color:#fff;font-family:Arial;margin:0;padding:12px}.header{text-align:center;padding:18px;border:2px solid #facc15;border-radius:14px;background:#111}.header h1{color:#facc15;margin:0}.box{background:#151515;border:1px solid #333;border-radius:12px;padding:12px;margin:12px 0}.box label{color:#facc15;font-size:13px;display:block;margin-bottom:6px}.input-row{display:flex;gap:6px}.box input{flex:1;padding:12px;border-radius:8px;border:none;background:#222;color:#fff;box-sizing:border-box;margin-bottom:8px}.mic-btn{background:#facc15;color:#000;border:none;border-radius:8px;padding:0 16px;font-size:20px;cursor:pointer;margin-bottom:8px}.mic-btn.listening{background:#ff0000;color:#fff;animation:pulse 1s infinite}@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}.btn{width:100%;padding:14px;background:#facc15;color:#000;border:none;border-radius:8px;font-weight:bold;font-size:16px;cursor:pointer}.console{background:#000;border:1px solid #333;border-radius:10px;padding:10px;font-family:monospace;font-size:12px;color:#0f0;min-height:50px;margin-top:10px}.preview{background:#fff;color:#000;border-radius:12px;display:none;margin-top:12px;overflow:hidden}.preview-head{background:#facc15;padding:10px;font-weight:bold;display:flex;justify-content:space-between}.item{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #eee}</style></head><body><div class="header"><h1>⚡ SAMAD-AGENT 🎤 VOICE</h1><p style="color:#aaa;font-size:12px">Bolo aur Website Banao - No Typing!</p></div><div class="box"><label>📝 Bolke Order Do (Mic Dabao):</label><div class="input-row"><input id="order" placeholder="Mic dabao aur bolo..."><button class="mic-btn" id="micBtn" onclick="startVoice()">🎤</button></div><label>💰 Manual Price (Optional):</label><input id="p1" placeholder="Price 1 - Ex: 600"><input id="p2" placeholder="Price 2 - Ex: 400"><input id="p3" placeholder="Price 3 - Ex: 1000"><input id="wa" placeholder="WhatsApp No"><button class="btn" onclick="run()">🚀 GENERATE WEBSITE</button><p style="color:#888;font-size:11px;text-align:center;margin-top:8px">💡 Mic dabao -> Bolo -> Auto Generate!</p></div><div class="console" id="log">> Voice Agent Ready...<br>> Mic dabao Samad...</div><div class="preview" id="preview"><div class="preview-head"><span>🎉 Ready!</span><button onclick="openFull()" style="background:#000;color:#facc15;border:none;padding:5px 10px;border-radius:5px">OPEN FULL ↗</button></div><div id="out" style="padding:15px"></div></div><script>let cur="";let recognition;function log(m){document.getElementById('log').innerHTML+="<br>> "+m}function startVoice(){let btn=document.getElementById('micBtn');if(!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)){alert("Voice is browser me support nahi, Chrome use karo!");return}const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;recognition=new SpeechRecognition();recognition.lang='en-IN';recognition.interimResults=false;recognition.onstart=function(){btn.classList.add('listening');btn.innerHTML='🔴';log("Sun raha hun... Bolo Samad!")};recognition.onend=function(){btn.classList.remove('listening');btn.innerHTML='🎤';log("Voice band...")};recognition.onresult=function(e){let text=e.results[0][0].transcript;document.getElementById('order').value=text;log("Tumne bola: "+text);log("Auto generate ho raha hai...");setTimeout(run,500)};recognition.onerror=function(e){log("Error: "+e.error);btn.classList.remove('listening');btn.innerHTML='🎤'};recognition.start()}function extractPrices(t){const n=t.match(/\d{3,5}/g);return n||[]}function run(){let order=document.getElementById('order').value.trim();let pp1=document.getElementById('p1').value.trim();let pp2=document.getElementById('p2').value.trim();let pp3=document.getElementById('p3').value.trim();let wa=document.getElementById('wa').value.trim()||"923000000000";if(!order){alert("Pehle bolo ya likho!");return}let auto=extractPrices(order);let price1=pp1||auto[0]||"550";let price2=pp2||auto[1]||"450";let price3=pp3||auto[2]||"850";log("Price: "+price1+", "+price2+", "+price3);let html="";let low=order.toLowerCase();if(low.includes("burger")||low.includes("food")||low.includes("pizza")||low.includes("zinger")||low.includes("restaurant")){html=`<div style="background:#fff8e1;padding:15px;border-radius:10px;text-align:center"><h1>🍔 SAMAD BURGER POINT</h1><p>Fresh & Juicy</p><div class="item"><span>🔥 Zinger Burger</span><b>Rs.${price1}</b></div><div class="item"><span>🍔 Cheese</span><b>Rs.${price2}</b></div><div class="item"><span>🍟 Deal</span><b>Rs.${price3}</b></div><div style="margin-top:18px"><a href="https://wa.me/${wa}" style="background:#25D366;color:#fff;padding:12px 22px;border-radius:8px;text-decoration:none">WhatsApp Order</a></div></div>`}else if(low.includes("cloth")||low.includes("kapra")||low.includes("dress")||low.includes("shop")||low.includes("kurta")){html=`<div style="background:#fff;padding:15px;text-align:center"><h1>👗 SAMAD CLOTHING</h1><div style="display:flex;flex-wrap:wrap;justify-content:center"><div style="border:1px solid #ddd;border-radius:10px;padding:12px;margin:6px;min-width:90px"><h4>Kurta</h4><p>Rs.${price1}</p></div><div style="border:1px solid #ddd;border-radius:10px;padding:12px;margin:6px;min-width:90px"><h4>Suit</h4><p>Rs.${price2}</p></div><div style="border:1px solid #ddd;border-radius:10px;padding:12px;margin:6px;min-width:90px"><h4>Kids</h4><p>Rs.${price3}</p></div></div><a href="https://wa.me/${wa}" style="background:#000;color:#facc15;padding:12px 22px;border-radius:8px;text-decoration:none;display:inline-block;margin-top:15px">WhatsApp</a></div>`}else{html=`<div style="padding:10px"><h2 style="text-align:center">${order}</h2><div style="background:#f5f5f5;padding:12px;border-radius:8px"><div class="item"><span>Service 1</span><b>Rs.${price1}</b></div><div class="item"><span>Service 2</span><b>Rs.${price2}</b></div><div class="item"><span>Deal</span><b>Rs.${price3}</b></div></div><div style="text-align:center;margin-top:15px"><a href="https://wa.me/${wa}" style="background:#facc15;color:#000;padding:12px 22px;border-radius:8px;text-decoration:none;font-weight:bold">Contact: ${wa}</a></div></div>`}cur=html;document.getElementById('out').innerHTML=html;document.getElementById('preview').style.display="block";log("Website Ready ✅")}function openFull(){let w=window.open();w.document.write(cur)}</script></body></html>
